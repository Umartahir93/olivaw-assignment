services:
  db:
    # PostgreSQL with the TimescaleDB extension, for measurements later on.
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      # Test setup: creates the fleet_test database that integration tests
      # use, so they never touch development data.
      - ./test/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The server: applies the migrations, then serves REST and gRPC.
  fleet:
    build:
      context: .
      target: fleet
    environment:
      DATABASE_URL: postgres://fleet:fleet@db:5432/fleet?sslmode=disable
    ports:
      - "8080:8080" # REST
      - "9090:9090" # gRPC
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The image has no shell or curl; the binary checks itself.
      test: ["CMD", "/fleet", "-health-check"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The gateway simulator, sending its robots' measurements to the server. It
  # is only the gateway: an operator registers it over REST first, so it only
  # starts on demand with that gatewayId (`make simulate GATEWAY_ID=...`).
  simulator:
    profiles: [simulator]
    build:
      context: .
      target: simulator
    command: ["-server", "fleet:9090", "-gateway-id", "${GATEWAY_ID:-}", "-robots", "5"]
    depends_on:
      fleet:
        condition: service_healthy

  # Integration tests in a Go container next to the database. Only started on
  # demand (`make test_integration_docker`), never by `make up`.
  integration-tests:
    profiles: [test]
    image: golang:1.26
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://fleet:fleet@db:5432/fleet_test?sslmode=disable
    command: ["go", "test", "-tags", "integration", "-race", "-count=1", "-p", "1", "./..."]
    depends_on:
      db:
        condition: service_healthy

  # End-to-end tests in a Go container, against the server in Docker over its
  # REST and gRPC APIs. Only started on demand (`make test_e2e_docker`).
  e2e-tests:
    profiles: [test]
    image: golang:1.26
    working_dir: /src
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      FLEET_REST_URL: http://fleet:8080
      FLEET_GRPC_ADDR: fleet:9090
    command: ["go", "test", "-tags", "e2e", "-count=1", "-v", "./test/e2e/..."]
    depends_on:
      fleet:
        condition: service_healthy

volumes:
  # Go module and build caches, kept between test runs.
  go-mod:
  go-build:
