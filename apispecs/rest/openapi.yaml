openapi: 3.0.3
info:
  title: Olivaw Fleet API
  version: 1.0.0
  description: |
    Register gateways and follow what the fleet is doing: the current state
    of every gateway and robot, and the recent measurements and faults of
    each robot.
tags:
  - name: Gateways
    description: Gateways and the robots connected to them.
  - name: Robots
    description: One robot, its current state and its history.

paths:
  /v1/gateways:
    get:
      operationId: listGateways
      tags: [Gateways]
      summary: List gateways
      responses:
        "200":
          description: All gateways, oldest first by registeredAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGateway
      tags: [Gateways]
      summary: Register a gateway
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayCreate"
      responses:
        "201":
          description: The gateway was registered.
          headers:
            Location:
              description: URL of the new gateway.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A gateway with this serial number is already registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateways/{gatewayId}:
    parameters:
      - $ref: "#/components/parameters/GatewayId"
    get:
      operationId: getGateway
      tags: [Gateways]
      summary: Get a gateway
      responses:
        "200":
          description: The gateway.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gateway"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/gateways/{gatewayId}/robots:
    parameters:
      - $ref: "#/components/parameters/GatewayId"
    get:
      operationId: listGatewayRobots
      tags: [Gateways]
      summary: List a gateway's robots and their current state
      parameters:
      responses:
        "200":
          description: All of the gateway's robots, oldest first by firstSeenAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobotList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/robots/{robotId}:
    parameters:
      - $ref: "#/components/parameters/RobotId"
    get:
      operationId: getRobot
      tags: [Robots]
      summary: Get a robot and its current state
      responses:
        "200":
          description: The robot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Robot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/robots/{robotId}/measurements:
    parameters:
      - $ref: "#/components/parameters/RobotId"
    get:
      operationId: listRobotMeasurements
      tags: [Robots]
      summary: List a robot's measurements
      description: |
        Returns measurements from a time range of at most 24 hours, on any
        date. Without `from` and `to`, that is the last 24 hours.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The measurements in the time range, oldest first by measuredAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/robots/{robotId}/faults:
    parameters:
      - $ref: "#/components/parameters/RobotId"
    get:
      operationId: listRobotFaults
      tags: [Robots]
      summary: List a robot's faults
      description: |
        Returns faults from a time range of at most 24 hours, on any date.
        Without `from` and `to`, that is the last 24 hours.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: The faults in the time range, oldest first by occurredAt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaultList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    GatewayId:
      name: gatewayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RobotId:
      name: robotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      description: |
        Start of the time range, inclusive. Defaults to 24 hours before `to`.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: |
        End of the time range, exclusive, at most 24 hours after `from`.
        Defaults to now.
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: Invalid request, e.g. a malformed parameter or a time range longer than 24 hours.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The gateway or robot does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Unexpected error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    # Gateways

    Gateway:
      type: object
      description: A gateway and whether the system hears from it.
      required: [gatewayId, serialNumber, location, registeredAt, connectivity]
      properties:
        gatewayId:
          type: string
          format: uuid
          description: Assigned at registration; never changes.
        serialNumber:
          type: string
          description: Business key, from the gateway's manufacturer.
        location:
          type: string
          description: Where the gateway is installed, e.g. "Munich HQ".
        name:
          type: string
          description: Optional display name.
        registeredAt:
          type: string
          format: date-time
        connectivity:
          $ref: "#/components/schemas/Connectivity"
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the gateway last called the system; null if never.

    GatewayCreate:
      type: object
      required: [serialNumber, location]
      properties:
        serialNumber:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique across the fleet.
        location:
          type: string
          minLength: 1
          maxLength: 200
          description: Where the gateway is installed, e.g. "Munich HQ".
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional display name.

    GatewayList:
      type: object
      description: |
        All matching gateways. For the sake of simplicity, lists are not
        paginated; pagination is worth adding as they grow.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Gateway"

    Connectivity:
      type: string
      description: |
        unknown: no contact yet. online: something arrived in the last 5
        minutes. offline: nothing arrived for longer.
      enum: [unknown, online, offline]

    # Robots

    Robot:
      type: object
      description: A robot and its current state.
      required: [robotId, serialNumber, gatewayId, firstSeenAt, connectivity]
      properties:
        robotId:
          type: string
          format: uuid
          description: Assigned when the robot is first scanned; never changes.
        serialNumber:
          type: string
          description: Business key, from the robot's manufacturer.
        gatewayId:
          type: string
          format: uuid
          description: The gateway the robot is connected to.
        firstSeenAt:
          type: string
          format: date-time
          description: When a scan first reported the robot.
        connectivity:
          $ref: "#/components/schemas/Connectivity"
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
          description: When the robot's last measurement arrived; null if never.
        latest:
          allOf:
            - $ref: "#/components/schemas/Measurement"
          nullable: true
          description: The newest measurement; null if none yet.

    RobotList:
      type: object
      description: |
        All matching robots. For the sake of simplicity, lists are not
        paginated; pagination is worth adding as they grow.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Robot"

    # Measurements and faults

    Measurement:
      type: object
      description: A snapshot of one robot's state at one moment.
      required: [activity, activeFaultCodes, measuredAt]
      properties:
        batteryPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          nullable: true
          description: Null if not reported.
        position:
          allOf:
            - $ref: "#/components/schemas/Position"
          nullable: true
          description: Null if not reported.
        activity:
          $ref: "#/components/schemas/Activity"
        activeFaultCodes:
          type: array
          description: Codes of the faults active at this moment; empty when all is well.
          items:
            type: string
        measuredAt:
          type: string
          format: date-time
          description: When the measurement was taken.

    Position:
      type: object
      required: [mapId, x, y, headingRad]
      properties:
        mapId:
          type: string
        x:
          type: number
          format: double
          description: Metres from the map's origin.
        y:
          type: number
          format: double
          description: Metres from the map's origin.
        headingRad:
          type: number
          format: double
          description: Radians, counter-clockwise from the map's x axis.

    Activity:
      type: string
      description: |
        What the robot is doing. error: the robot cannot work. unknown: not
        reported.
      enum: [unknown, idle, moving, charging, error]

    Fault:
      type: object
      description: |
        One occurrence of a fault. While the fault is active, its code is
        listed in the robot's measurements.
      required: [code, severity, message, occurredAt]
      properties:
        code:
          type: string
          description: E.g. "LIDAR_TIMEOUT".
        severity:
          type: string
          description: |
            warning: the robot keeps working. critical: the robot cannot work
            until someone helps. unknown: not reported.
          enum: [unknown, warning, critical]
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
          description: When the robot detected the fault.

    MeasurementList:
      type: object
      description: |
        All matching measurements. For the sake of simplicity, lists are not
        paginated; pagination is worth adding as they grow.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Measurement"

    FaultList:
      type: object
      description: |
        All matching faults. For the sake of simplicity, lists are not
        paginated; pagination is worth adding as they grow.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fault"

    # Errors

    Problem:
      type: object
      description: Problem details (RFC 9457).
      required: [title, status]
      properties:
        type:
          type: string
          description: URI identifying the problem type.
          default: about:blank
        title:
          type: string
          description: Short summary, e.g. "Not Found".
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence.
        instance:
          type: string
          description: URI of the request that failed.
