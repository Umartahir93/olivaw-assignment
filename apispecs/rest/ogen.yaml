# ogen generates the models, the server side of the REST contract (routing,
# decoding and validation of parameters and bodies) and a client, which the
# end-to-end tests use. The handlers that implement fleetv1.Handler are
# written by hand in pkg/gateway/handler and pkg/robot/handler.
generator:
  features:
    disable:
      - webhooks/client
      - webhooks/server
      - ogen/otel
      - ogen/unimplemented
