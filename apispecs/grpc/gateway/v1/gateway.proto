syntax = "proto3";

package gateway.v1;

import "google/protobuf/timestamp.proto";

// The gRPC API for gateways. A gateway is the edge device at a site that
// robots are connected to; robots never call this API themselves.
//
// Identity: every call carries the gateway's gatewayId in the
// `x-gateway-id` metadata key. It stands in for an mTLS client certificate
// in production. A gateway may only report for its own robots.
//
// Errors:
//   - INVALID_ARGUMENT (fails validation), UNAUTHENTICATED (x-gateway-id
//     missing or not a UUID): do not retry. Drop the item and log it.
//   - Any other code, e.g. UNAVAILABLE or DEADLINE_EXCEEDED (server
//     unreachable), PERMISSION_DENIED (gateway not registered, or robot not
//     one of this gateway's), INTERNAL: retry up to 3 times with
//     exponential backoff. Then move the item to the gateway's dead-letter
//     queue, log it and count it in a metric; an alert tells an operator to
//     fix the cause and replay the queue.
//
// Timestamps are stored with microsecond precision; finer digits are dropped.

// GatewayService keeps the system's list of a gateway's robots in step with
// the gateway.
service GatewayService {
  // Returns the robots the system knows for this gateway, with their
  // robotId. A gateway calls it after a restart, so every robot keeps its
  // robotId.
  rpc ListRobots(ListRobotsRequest) returns (ListRobotsResponse);

  // Reports the result of a scan: the full list of robots connected to the
  // gateway. Robots seen for the first time get a robotId; known robots
  // keep theirs. Robots missing from the list are kept. Sending the same
  // list twice changes nothing.
  //
  // INVALID_ARGUMENT if a serial number is empty or appears twice.
  rpc ReportScan(ReportScanRequest) returns (ReportScanResponse);
}

// ListRobotsRequest is empty; the gateway is identified by x-gateway-id.
message ListRobotsRequest {}

// ListRobotsResponse lists the gateway's robots.
message ListRobotsResponse {
  repeated Robot robots = 1;
}

// ReportScanRequest carries the full list of robots a scan found.
message ReportScanRequest {
  // Serial numbers of all robots connected to the gateway.
  repeated string serial_numbers = 1;
}

// ReportScanResponse returns every scanned robot with its robotId.
message ReportScanResponse {
  repeated Robot robots = 1;
}

// Robot is a robot known to the system.
message Robot {
  // Assigned by the system; never changes.
  string robot_id = 1;
  // Business key, from the robot's manufacturer.
  string serial_number = 2;
}

// RobotService receives data about one robot, sent by its gateway.
//
// Delivery: one item per request, oldest first. OK means it is stored, so
// the gateway can drop it from its buffer. Every item has an idempotency
// key; an item whose key is already stored is answered with OK and not
// stored again, so resending is always safe.
service RobotService {
  // Reports one measurement of one robot, about once per second.
  // Idempotency key: (robot_id, measured_at).
  //
  // INVALID_ARGUMENT if:
  //   - measurement is missing
  //   - robot_id is not a UUID
  //   - measured_at is missing or invalid
  //   - battery_pct is set and not a finite number from 0 to 100
  //   - position is set and x, y or heading_rad is not finite
  rpc ReportMeasurement(ReportMeasurementRequest) returns (ReportMeasurementResponse);

  // Reports one fault of one robot once, when the robot first detects it.
  // While the fault is active, its code is listed in every measurement.
  // Idempotency key: (robot_id, code, occurred_at).
  //
  // INVALID_ARGUMENT if:
  //   - fault is missing
  //   - robot_id is not a UUID
  //   - code is empty
  //   - occurred_at is missing or invalid
  rpc ReportFault(ReportFaultRequest) returns (ReportFaultResponse);
}

// ReportMeasurementRequest carries one measurement.
message ReportMeasurementRequest {
  Measurement measurement = 1;
}

// ReportMeasurementResponse is empty; the OK status is the acknowledgement.
message ReportMeasurementResponse {}

// ReportFaultRequest carries one fault.
message ReportFaultRequest {
  Fault fault = 1;
}

// ReportFaultResponse is empty; the OK status is the acknowledgement.
message ReportFaultResponse {}

// Measurement is a snapshot of one robot's state at one moment.
message Measurement {
  // The robot this measurement belongs to.
  string robot_id = 1;

  // Charge level, 0 to 100. Unset if the robot does not report it.
  optional double battery_pct = 2;

  // Estimated position. Unset if the robot does not report it.
  Position position = 3;

  Activity activity = 4;

  // Fault.code of every fault active right now, repeated in each
  // measurement until the fault is resolved; empty when all is well.
  repeated string active_fault_codes = 5;

  // When the measurement was taken, by the robot's or gateway's clock. The
  // system records its own receive time separately.
  google.protobuf.Timestamp measured_at = 6;
}

// Position is where the robot thinks it is, and which way it faces.
message Position {
  // Which map, e.g. one per floor of a site.
  string map_id = 1;
  // Metres from the map's origin.
  double x = 2;
  double y = 3;
  // Radians, counter-clockwise from the map's x axis.
  double heading_rad = 4;
}

// Activity is what the robot says it is doing.
enum Activity {
  ACTIVITY_UNSPECIFIED = 0;
  ACTIVITY_IDLE = 1;
  ACTIVITY_MOVING = 2;
  ACTIVITY_CHARGING = 3;
  // Stopped by a fault; see active_fault_codes.
  ACTIVITY_ERROR = 4;
}

// Fault is a problem a robot detected.
message Fault {
  // Severity is how much the fault affects the robot's work.
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    // The robot keeps working.
    SEVERITY_WARNING = 1;
    // The robot cannot work until someone helps.
    SEVERITY_CRITICAL = 2;
  }

  // The robot this fault belongs to.
  string robot_id = 1;
  // Vendor-defined, e.g. "LIDAR_TIMEOUT".
  string code = 2;
  Severity severity = 3;
  // Description for humans.
  string message = 4;
  // When the robot detected the fault, by its own clock.
  google.protobuf.Timestamp occurred_at = 5;
}
