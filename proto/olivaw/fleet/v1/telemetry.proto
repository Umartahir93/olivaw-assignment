syntax = "proto3";

package olivaw.fleet.v1;

import "google/protobuf/timestamp.proto";

// TelemetryService receives data from robots.
//
// Identity: the robot sends its ID in the `x-robot-id` metadata key. This
// stands in for an mTLS client certificate in production.
//
// Delivery: one reading or fault per request, oldest first. OK means it is
// stored and the robot can remove it from its buffer. An item whose key was
// already stored also gets OK and is ignored (first write wins), so resending
// is always safe.
//
// Errors:
//   - INVALID_ARGUMENT (fails validation), UNAUTHENTICATED (no x-robot-id):
//     do not retry. Drop the item and log it on the robot.
//   - Any other code, e.g. UNAVAILABLE or DEADLINE_EXCEEDED (server
//     unreachable), PERMISSION_DENIED (robot not registered), INTERNAL:
//     retry up to 3 times with exponential backoff. Then move the item to
//     the robot's dead-letter queue (DLQ), log it on the robot and count it
//     in a metric. DLQ items are kept but not resent automatically; an alert
//     on the metric tells an operator to fix the cause and replay the DLQ.
//     Metrics, alerts and replay are out of scope for this contract.
//
// Timestamps are stored with microsecond precision; finer digits are dropped.
service TelemetryService {
  // Reports one state snapshot, about once per second.
  // Key: (robot_id, recorded_at).
  //
  // INVALID_ARGUMENT if:
  //   - reading is missing
  //   - recorded_at is missing or invalid
  //   - battery_pct is set and not a finite number from 0 to 100
  //   - position is set and x, y or heading_rad is not finite
  rpc ReportTelemetry(ReportTelemetryRequest) returns (ReportTelemetryResponse);

  // Reports one fault once, when the robot first detects it; not again while
  // it stays active. This is the fault history; active faults come from
  // TelemetryReading.active_fault_codes.
  // Key: (robot_id, code, occurred_at).
  //
  // INVALID_ARGUMENT if:
  //   - fault is missing
  //   - code is empty
  //   - occurred_at is missing or invalid
  rpc ReportFault(ReportFaultRequest) returns (ReportFaultResponse);
}

// ---------------------------------------------------------------------------
// ReportTelemetry
// ---------------------------------------------------------------------------

// ReportTelemetryRequest carries one reading from one robot.
message ReportTelemetryRequest {
  TelemetryReading reading = 1;
}

// ReportTelemetryResponse is empty; the OK status is the acknowledgement.
message ReportTelemetryResponse {}

// TelemetryReading is a snapshot of a robot's state.
message TelemetryReading {
  // Charge level, 0 to 100. Unset if the robot does not report it.
  optional double battery_pct = 1;

  // Estimated position. Unset if the robot is not localized.
  Position position = 2;

  Activity activity = 3;

  // Fault.code of every fault active right now, repeated in each snapshot
  // until the fault is resolved; empty when all is well. A fault is resolved
  // once its code disappears. Details arrive once through ReportFault.
  repeated string active_fault_codes = 4;

  // When the snapshot was taken, by the robot's clock. The server records
  // its own receive time separately.
  google.protobuf.Timestamp recorded_at = 5;
}

// Position is where the robot thinks it is, and which way it faces.
message Position {
  // Which map, e.g. one per floor of a site.
  string map_id = 1;
  // Metres from the map's origin.
  double x = 2;
  double y = 3;
  // Radians, counter-clockwise from the map's x axis.
  double heading_rad = 4;
}

// Activity is what the robot says it is doing.
enum Activity {
  ACTIVITY_UNSPECIFIED = 0;
  ACTIVITY_IDLE = 1;
  ACTIVITY_MOVING = 2;
  ACTIVITY_CHARGING = 3;
  // Stopped by a fault; see active_fault_codes.
  ACTIVITY_ERROR = 4;
}

// ---------------------------------------------------------------------------
// ReportFault
// ---------------------------------------------------------------------------

// ReportFaultRequest carries one fault from one robot.
message ReportFaultRequest {
  Fault fault = 1;
}

// ReportFaultResponse is empty; the OK status is the acknowledgement.
message ReportFaultResponse {}

// Fault is a problem the robot detected.
message Fault {
  // Severity is how much the fault affects the robot's work.
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    // The robot keeps working.
    SEVERITY_WARNING = 1;
    // The robot cannot work until someone helps.
    SEVERITY_CRITICAL = 2;
  }

  // Vendor-defined, e.g. "LIDAR_TIMEOUT".
  string code = 1;
  Severity severity = 2;
  // Description for humans.
  string message = 3;
  // When the robot detected it, by its own clock.
  google.protobuf.Timestamp occurred_at = 4;
}
